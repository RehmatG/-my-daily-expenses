<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Daily Expenses</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#263027;--muted:#687066;--line:#ded9ce;--accent:#9a603e;--soft:#f1e4d3;--danger:#a84c45}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:920px;margin:auto;padding:34px 18px 70px}.brand{font-family:Georgia,serif;font-size:clamp(38px,7vw,68px);line-height:1.05;margin:0}.tag{font-size:20px;color:var(--muted);margin:10px 0 28px}.rule{border:0;border-top:1px solid var(--line);margin:0 0 26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;margin-bottom:24px;box-shadow:0 2px 8px #00000008}.title{font-size:24px;font-weight:750;margin:0 0 20px}
.quick{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}.chip{border:2px solid #e2ddd2;background:#faf9f5;border-radius:30px;padding:12px 19px;font-size:17px;cursor:pointer;color:var(--ink)}.chip:hover{border-color:#b89a84}.chip.add{border-style:dashed;color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field label{display:block;font-size:16px;color:var(--muted);margin:0 0 8px}.field input,.field select{width:100%;height:58px;border:2px solid #e2ddd2;background:#faf9f5;border-radius:14px;padding:0 16px;font-size:18px;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#b98a6c}
.primary{width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:18px;font-weight:750;padding:17px;margin-top:20px;cursor:pointer}.primary:hover{filter:brightness(.95)}
.summary-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.month{height:48px;border:2px solid #e2ddd2;border-radius:12px;background:#faf9f5;padding:0 12px;font-size:17px;color:var(--ink)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.metric{background:var(--soft);border-radius:17px;padding:18px}.metric strong{font-size:28px;display:block}.metric span{color:var(--muted);font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:24px}.section-label{font-size:18px;font-weight:750;margin-bottom:12px}.bar{height:13px;background:#eee9df;border-radius:20px;overflow:hidden;margin:7px 0 13px}.bar i{display:block;height:100%;background:var(--accent);border-radius:20px}.catrow{display:flex;justify-content:space-between;font-size:15px}
.empty{color:var(--muted);font-size:17px;padding:8px 0}.expense-list{display:flex;flex-direction:column;gap:10px}.expense{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:15px;padding:15px 16px;background:#fcfbf8}.expense .left{min-width:0}.expense b{display:block;font-size:17px}.expense small{color:var(--muted)}.expense .right{text-align:right;white-space:nowrap}.expense .amt{font-weight:800}.del{border:0;background:transparent;color:var(--danger);cursor:pointer;font-size:13px;margin-top:5px}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(100px);background:#263027;color:#fff;padding:13px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:5}.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:650px){.app{padding:25px 16px 55px}.grid,.two,.metrics{grid-template-columns:1fr}.summary-head{align-items:flex-start;flex-direction:column}.month{width:100%}.card{padding:20px}.chip{font-size:16px;padding:10px 15px}.metric strong{font-size:25px}}
</style>
</head>
<body>
<main class="app">
  <h1 class="brand">My Daily Expenses</h1>
  <div class="tag">Log it, forget it, see it add up.</div>
  <hr class="rule">

  <section class="card">
    <h2 class="title">Add an expense</h2>
    <div class="quick" id="quick"></div>
    <form id="form">
      <div class="grid">
        <div class="field"><label>Item</label><input id="item" placeholder="e.g. Coffee" required></div>
        <div class="field"><label>Amount</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required></div>
        <div class="field"><label>Category</label><select id="category"></select></div>
        <div class="field"><label>Date</label><input id="date" type="date" required></div>
      </div>
      <button class="primary">Add expense</button>
    </form>
  </section>

  <section class="card">
    <div class="summary-head">
      <h2 class="title" style="margin:0">Monthly summary</h2>
      <input class="month" id="month" type="month">
    </div>
    <div class="metrics">
      <div class="metric"><strong id="total">0.00</strong><span>Total spent</span></div>
      <div class="metric"><strong id="entries">0</strong><span>Entries</span></div>
      <div class="metric"><strong id="avg">0.00</strong><span>Avg / active day</span></div>
    </div>
    <div class="two">
      <div><div class="section-label">Category breakdown</div><div id="categories"></div></div>
      <div><div class="section-label">Daily expenses</div><div id="days"></div></div>
    </div>
  </section>

  <section class="card">
    <h2 class="title">Expense history</h2>
    <div id="history" class="expense-list"></div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const categories=["Food","Travel","Shopping","Bills","Health","Entertainment","Education","Rent","Other"];
const quickItems=["Biryani","Samosa","Kaleji Paav","Anda Pulav","Eggs","Chicken","Cigarette","Mukhwas","Water","Petrol","Chocolate","Padika"];
const $=id=>document.getElementById(id);
let expenses=JSON.parse(localStorage.getItem("myDailyExpenses")||"[]");
const today=new Date(), iso=d=>new Date(d+"T00:00:00").toISOString().slice(0,10);
$("date").value=iso(today); $("month").value=iso(today).slice(0,7);
$("category").innerHTML=categories.map(c=>`<option>${c}</option>`).join("");
$("quick").innerHTML=quickItems.map(x=>`<button type="button" class="chip" data-item="${x}">${x}</button>`).join("")+
`<button type="button" class="chip add" id="custom">+ Add item</button>`;

document.querySelectorAll("[data-item]").forEach(b=>b.onclick=()=>{$("item").value=b.dataset.item;$("item").focus()});
$("custom").onclick=()=>{$("item").value="";$("item").focus()};

function save(){localStorage.setItem("myDailyExpenses",JSON.stringify(expenses))}
function money(n){return Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function render(){
 const m=$("month").value, rows=expenses.filter(e=>e.date.startsWith(m));
 const total=rows.reduce((s,e)=>s+Number(e.amount),0);
 const days=new Set(rows.map(e=>e.date)).size;
 $("total").textContent=money(total); $("entries").textContent=rows.length; $("avg").textContent=money(days?total/days:0);
 const sums={}; rows.forEach(e=>sums[e.category]=(sums[e.category]||0)+Number(e.amount));
 const cats=Object.entries(sums).sort((a,b)=>b[1]-a[1]);
 $("categories").innerHTML=cats.length?cats.map(([c,v])=>`<div class="catrow"><span>${c}</span><b>${money(v)}</b></div><div class="bar"><i style="width:${total?v/total*100:0}%"></i></div>`).join(""):`<div class="empty">No expenses for this month yet.</div>`;
 const ds={}; rows.forEach(e=>ds[e.date]=(ds[e.date]||0)+Number(e.amount));
 const dr=Object.entries(ds).sort((a,b)=>b[0].localeCompare(a[0]));
 $("days").innerHTML=dr.length?dr.map(([d,v])=>`<div class="catrow"><span>${new Date(d+"T00:00:00").toLocaleDateString(undefined,{day:"2-digit",month:"short"})}</span><b>${money(v)}</b></div><div class="bar"><i style="width:${total?v/total*100:0}%"></i></div>`).join(""):`<div class="empty">No expenses for this month yet.</div>`;
 const all=[...expenses].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 $("history").innerHTML=all.length?all.map(e=>`<div class="expense"><div class="left"><b>${escapeHtml(e.item)}</b><small>${e.category} · ${new Date(e.date+"T00:00:00").toLocaleDateString()}</small></div><div class="right"><div class="amt">${money(e.amount)}</div><button class="del" onclick="removeExpense(${e.id})">Delete</button></div></div>`).join(""):`<div class="empty">No expenses added yet.</div>`;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
$("form").onsubmit=e=>{e.preventDefault();const amount=Number($("amount").value);if(!amount||amount<=0)return;
 expenses.push({id:Date.now(),item:$("item").value.trim(),amount,category:$("category").value,date:$("date").value});save();e.target.reset();$("date").value=iso(new Date());$("category").value="Food";render();showToast("Expense added");};
function removeExpense(id){if(confirm("Delete this expense?")){expenses=expenses.filter(e=>e.id!==id);save();render();showToast("Expense deleted")}}
$("month").onchange=render;
function showToast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
render();
</script>
</body>
</html>
